[Match]
Architecture=x86-64

# PC/VM: UEFI with systemd-boot and unified kernel images (mkosi.conf, mkosi.repart/)
[Content]
Packages=linux-image-amd64
         systemd-boot
         systemd-boot-efi
# Only the modules mkosi's initrd needs (storage, file systems, virtio, ...) instead of all of them: the initrd
# shrinks from about 127 MB, the boot gets faster. The rest is loaded from the root file system. virtio-gpu: the
# display driver of the VM, the boot splash starts on it in the initrd. hid, edac_mce_amd: udev in the initrd asks
# for them (error messages without them).
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
                           /virtio-gpu.ko
                           /hid.ko
                           /edac_mce_amd.ko
