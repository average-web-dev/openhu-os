# Media player plugin (org.openhu.media): music from USB sticks and its data folder. mpv plays (a child process
# with JSON IPC), python3-mutagen reads the tags for the library. Playlists it saves go to Playlists/<name>.m3u8 on
# the stick through "pkexec openhu-cli usb write" (the stick stays read-only otherwise).
# (openhu-plugins: plugins/org.openhu.media/README.md, manifest "packages")
[Content]
Packages=mpv
         python3-mutagen
