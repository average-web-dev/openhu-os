[Match]
Architecture=arm64

# Raspberry Pi 4 and 5 (#39): one image for both. The Pi firmware boots from a FAT partition, not UEFI: mkosi only
# builds the directory tree with the kernels and their initrds, rpi/assemble.sh (run by scripts/build.sh) makes the
# boot partition and the disk from it.
# The same OS as on x86 (IMAGE_ID=openhu-os: OpenHU shows its system settings only for that), the board is the
# variant (VARIANT_ID=rpi in os-release, mkosi.postinst.chroot); only the files are named openhu-os-rpi_<version>.
[Output]
Output=openhu-os-rpi_%v
Format=directory
SplitArtifacts=

[Content]
Bootloader=none
UnifiedKernelImages=no
# From the Raspberry Pi archive (rpi/sandbox: key, source, APT pin that allows only these): the Pi kernels with the
# Pi's video decoders (bcm2835-codec, openhu#10), the boot firmware, the onboard WiFi and Bluetooth firmware.
# linux-image-rpi-v8: Pi 4 (kernel8.img), linux-image-rpi-2712: Pi 5 (kernel_2712.img, 16K pages).
Packages=linux-image-rpi-v8
         linux-image-rpi-2712
         raspi-firmware
         firmware-brcm80211
         bluez-firmware
# As on x86 only the modules the initrd needs; vc4: the display driver, the boot splash starts on it in the initrd.
# erofs (root) and the storage drivers of the Pi are in "default" or built into the kernel.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
                           /vc4.ko
                           /hid.ko
ExtraTrees=%D/rpi/extra

[Build]
SandboxTrees=%D/rpi/sandbox
