# Partition 3: boot partition of slot B, empty until the first update writes into it. Already in the image, not
# created on the first boot: the Pi firmware counts boot_partition= in FAT partitions (the n-th FAT partition of the
# table, rpi-eeprom#654), so all FAT partitions must come first in the GPT: 1 autoboot, 2 boot A, 3 boot B.
[Partition]
Type=esp
Label=_empty
Format=vfat
SplitName=-
SizeMinBytes=256M
SizeMaxBytes=256M
