# Partition 1: only autoboot.txt. The Pi bootloader reads it first and boots the boot partition of the slot named
# there ([all]), or once the other one after reboot "0 tryboot" ([tryboot]). The firmware counts these numbers in
# FAT partitions, so the FAT partitions come first (02-boot-b.conf).
[Partition]
Type=esp
Label=openhu-autoboot
Format=vfat
CopyFiles=/boot/rpi/autoboot:/
SplitName=-
SizeMinBytes=64M
SizeMaxBytes=64M
