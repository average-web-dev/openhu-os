# Partition 2: boot partition of slot A (firmware, kernels, initrds, device trees, config.txt, cmdline.txt with this
# slot's root), made by rpi/assemble.sh. Split out as openhu-os-rpi_<version>.boot.raw: the update for the other
# slot's boot partition, like the root partition.
[Partition]
Type=esp
Label=openhu-boot_%A
Format=vfat
CopyFiles=/boot/rpi/boot:/
SplitName=boot
SizeMinBytes=256M
SizeMaxBytes=256M
