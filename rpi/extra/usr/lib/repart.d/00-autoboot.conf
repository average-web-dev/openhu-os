# First boot (systemd-repart), Raspberry Pi: the FAT partitions of the image (1 autoboot.txt, 2 and 3 the boot
# partitions of slots A and B) are matched first by type and left as they are; root slot B (5) and the data partition
# (6) follow (11-root-b.conf, 20-data.conf).
[Partition]
Type=esp
SizeMinBytes=64M
SizeMaxBytes=64M
