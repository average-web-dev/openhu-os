# Always runs, also with the time from the internet off (openhu-time ntp off): only systemd-timesyncd saves the
# time (every minute and at shutdown) and restores it at boot, the only clock a Raspberry Pi 4 keeps. "ntp off"
# gives it no servers instead (openhu-time boot writes /run/systemd/timesyncd.conf.d/openhu-os.conf).
[Service]
ExecStartPre=+/usr/libexec/openhu-os/openhu-time boot
