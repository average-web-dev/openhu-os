# BlueZ's SIM Access Profile plugin listens on RFCOMM channel 8, the channel of OpenHU's wireless Android Auto
# profile: the phone could not get the WiFi data ("RFCOMM server failed for OpenHU Android Auto: rfcomm_bind: Address
# already in use"). A head unit does not share a SIM card; Raspberry Pi OS turns the plugin off as well.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap
